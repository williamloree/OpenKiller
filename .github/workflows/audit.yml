# Modèle A.Github : audit des dépendances, chaque lundi et à chaque changement de lockfile.
name: Audit de sécurité

on:
  schedule:
    - cron: "0 6 * * 1"
  push:
    branches: [main]
    paths: ["Cargo.lock"]
  pull_request:
    paths: ["Cargo.lock"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit
